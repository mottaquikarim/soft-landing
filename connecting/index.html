<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taq Karim's Connections</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            'serif': ['Newsreader', 'Georgia', 'serif'],
            'sans': ['DM Sans', 'system-ui', 'sans-serif'],
          },
          colors: {
            'warm': {
              50: '#fdfcfb',
              100: '#faf6f2',
              200: '#f2ebe3',
              800: '#3d3530',
              900: '#2a2422',
            },
            'accent': '#b44a2d',
          }
        }
      }
    }
  </script>
  <style>
    body {
      background: linear-gradient(180deg, #fdfcfb 0%, #f7f3ef 100%);
      min-height: 100vh;
    }
    .card {
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .card:hover {
      transform: translateY(-2px);
    }
    .tag {
      transition: all 0.12s ease;
    }
    .tag:hover {
      background: #b44a2d;
      color: white;
    }
    .filter-pill.active {
      background: #b44a2d;
      color: white;
    }
    .checkbox-custom {
      appearance: none;
      width: 20px;
      height: 20px;
      border: 2px solid #d4cfc9;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.12s ease;
    }
    .checkbox-custom:checked {
      background: #b44a2d;
      border-color: #b44a2d;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 16 16' fill='white' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M12.207 4.793a1 1 0 010 1.414l-5 5a1 1 0 01-1.414 0l-2-2a1 1 0 011.414-1.414L6.5 9.086l4.293-4.293a1 1 0 011.414 0z'/%3E%3C/svg%3E");
    }
    .checkbox-custom:hover {
      border-color: #b44a2d;
    }
    .card {
      cursor: pointer;
    }
    .card.expanded .bio-text {
      display: block;
      -webkit-line-clamp: unset;
    }
    .card.expanded .tags-truncated {
      display: none;
    }
    .card.expanded .tags-full {
      display: flex;
    }
    .tags-full {
      display: none;
    }
    .card .expand-hint {
      opacity: 0.5;
      transition: opacity 0.15s ease;
    }
    .card:hover .expand-hint {
      opacity: 0.8;
    }
    .card.expanded .expand-hint {
      display: none;
    }
    .note-section {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease, opacity 0.2s ease;
      opacity: 0;
    }
    .card.expanded .note-section {
      max-height: 500px;
      opacity: 1;
      margin-top: 1rem;
    }
    .expand-indicator {
      transition: transform 0.2s ease;
    }
    .card.expanded .expand-indicator {
      transform: rotate(180deg);
    }
  </style>
</head>
<body class="font-sans text-warm-800 antialiased">
  <!-- Header -->
  <header class="border-b border-warm-200 bg-warm-50/80 backdrop-blur-sm sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-6">
      <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4">
        <div>
          <h1 class="font-serif text-2xl sm:text-3xl font-medium text-warm-900">Taq Karim's Connections</h1>
          <p class="text-warm-800/70 mt-1">People in my network open to new opportunities</p>
        </div>
        <div class="flex gap-2">
          <button id="share-btn" class="px-4 py-2 text-sm border border-warm-200 rounded-lg hover:border-accent hover:text-accent transition-colors flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/></svg>
            Share
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Filters Bar -->
  <div class="border-b border-warm-200 bg-warm-50">
    <div class="max-w-6xl mx-auto px-4 py-4">
      <div class="flex flex-col md:flex-row gap-4">
        <!-- Search -->
        <div class="relative flex-1">
          <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-warm-800/40" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          <input 
            type="text" 
            id="search" 
            placeholder="Search by name, skills, or keywords..." 
            class="w-full pl-10 pr-4 py-2.5 bg-white border border-warm-200 rounded-lg focus:outline-none focus:border-accent focus:ring-2 focus:ring-accent/10 transition-all"
          >
        </div>
        
        <!-- Location Filter -->
        <select id="location-filter" class="px-4 py-2.5 bg-white border border-warm-200 rounded-lg focus:outline-none focus:border-accent cursor-pointer">
          <option value="">All locations</option>
        </select>
        
        <!-- Preset Filters -->
        <select id="preset-filter" class="px-4 py-2.5 bg-white border border-warm-200 rounded-lg focus:outline-none focus:border-accent cursor-pointer">
          <option value="">Preset filters...</option>
        </select>
      </div>
      
      <!-- Active Tags -->
      <div id="active-tags" class="flex flex-wrap gap-2 mt-3 empty:mt-0"></div>
    </div>
  </div>

  <!-- Filter Blurb (when preset is active) -->
  <div id="blurb-section" class="hidden border-b border-warm-200 bg-gradient-to-r from-accent/5 to-transparent">
    <div class="max-w-6xl mx-auto px-4 py-4">
      <p id="blurb-text" class="font-serif text-lg italic text-warm-800/80"></p>
    </div>
  </div>

  <!-- Selection Blurb Display (when viewing shared selection) -->
  <div id="selection-blurb-section" class="hidden border-b border-warm-200 bg-gradient-to-r from-blue-50 to-transparent">
    <div class="max-w-6xl mx-auto px-4 py-4">
      <p id="selection-blurb-text" class="font-serif text-lg italic text-warm-800/80"></p>
    </div>
  </div>

  <!-- Main Content -->
  <main class="max-w-6xl mx-auto px-4 py-8">
    <!-- Results Count -->
    <div class="flex justify-between items-center mb-6">
      <p class="text-warm-800/60">
        Showing <span id="count" class="font-medium text-warm-900">0</span> people
      </p>
      <button id="clear-filters" class="text-sm text-accent hover:underline hidden">Clear filters</button>
    </div>

    <!-- Loading State -->
    <div id="loading" class="text-center py-20">
      <div class="inline-block w-8 h-8 border-2 border-warm-200 border-t-accent rounded-full animate-spin"></div>
      <p class="mt-4 text-warm-800/60">Loading...</p>
    </div>

    <!-- Error State -->
    <div id="error" class="hidden text-center py-20">
      <p class="text-warm-800/60">Something went wrong. Please try again later.</p>
    </div>

    <!-- Empty State -->
    <div id="empty" class="hidden text-center py-20">
      <p class="font-serif text-xl text-warm-800/80">No matches found</p>
      <p class="text-warm-800/60 mt-2">Try adjusting your filters</p>
    </div>

    <!-- People Grid -->
    <div id="grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>
  </main>

  <!-- Selection Bar -->
  <div id="selection-bar" class="fixed top-0 left-0 right-0 bg-warm-900 text-white px-4 py-3 shadow-lg z-50 opacity-0 pointer-events-none transition-all duration-200">
    <div class="max-w-6xl mx-auto flex flex-col sm:flex-row items-stretch sm:items-center gap-3">
      <div class="flex items-center justify-between sm:justify-start gap-3">
        <span class="whitespace-nowrap"><strong id="selected-count">0</strong> selected</span>
        <button id="add-more" class="hidden px-3 py-1.5 text-sm border border-white/30 rounded-lg hover:bg-white/10 transition-colors whitespace-nowrap">
          + Add More
        </button>
        <button id="clear-selected" class="px-3 py-1.5 text-sm border border-white/30 rounded-lg hover:bg-white/10 transition-colors sm:hidden">
          Clear
        </button>
      </div>
      <input
        type="text"
        id="selection-blurb-input"
        placeholder="Add a note about this selection..."
        class="flex-1 px-3 py-2 bg-white/10 border border-white/20 rounded-lg text-white placeholder-white/50 text-sm focus:outline-none focus:border-white/40"
      >
      <div class="flex gap-2">
        <button id="share-selected" class="flex-1 sm:flex-none px-4 py-2 bg-white text-warm-900 rounded-lg font-medium hover:bg-warm-100 transition-colors text-sm">
          Share Selection
        </button>
        <button id="clear-selected-desktop" class="hidden sm:block px-4 py-2 border border-white/30 rounded-lg hover:bg-white/10 transition-colors text-sm">
          Clear
        </button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-6 right-6 bg-warm-900 text-white px-5 py-3 rounded-lg shadow-xl opacity-0 pointer-events-none transition-opacity duration-200">
    Link copied!
  </div>

  <script>
    // =====================================================
    // CONFIGURATION - Replace with your Apps Script URL
    // =====================================================
    const API_URL = 'https://script.google.com/macros/s/AKfycbwSbAO8-VW-BTnOEzSHPXZ0L9INA8YjslfyypfzkvSmNhkp1fe_3rQ8tomkKvFsur94/exec';
    // =====================================================

    let people = [];
    let filters = [];
    let selectedIds = new Set();
    let activeTags = new Set();
    let selectionBlurb = '';

    // Initialize
    async function init() {
      try {
        // Fetch people and filters in parallel
        const [peopleRes, filtersRes] = await Promise.all([
          fetch(API_URL),
          fetch(`${API_URL}?filters=true`)
        ]);

        if (!peopleRes.ok) throw new Error('Failed to fetch people');
        
        people = await peopleRes.json();
        filters = await filtersRes.json();

        // Populate location dropdown
        const locations = [...new Set(people.map(p => p.location))].filter(Boolean).sort();
        const locSelect = document.getElementById('location-filter');
        locations.forEach(loc => {
          const opt = document.createElement('option');
          opt.value = loc;
          opt.textContent = loc;
          locSelect.appendChild(opt);
        });

        // Populate preset filters dropdown
        const presetSelect = document.getElementById('preset-filter');
        filters.forEach(f => {
          const opt = document.createElement('option');
          opt.value = f.slug;
          opt.textContent = f.name;
          presetSelect.appendChild(opt);
        });

        // Parse URL params
        parseUrlParams();

        // Hide loading, render
        document.getElementById('loading').classList.add('hidden');
        render();

      } catch (err) {
        console.error(err);
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('error').classList.remove('hidden');
      }
    }

    function parseUrlParams() {
      const params = new URLSearchParams(window.location.search);

      // Search
      const q = params.get('q');
      if (q) document.getElementById('search').value = q;

      // Location
      const loc = params.get('location');
      if (loc) document.getElementById('location-filter').value = loc;

      // Preset filter
      const preset = params.get('filter');
      if (preset) {
        document.getElementById('preset-filter').value = preset;
        applyPresetFilter(preset);
      }

      // Tags
      const tags = params.get('tags');
      if (tags) {
        tags.split(',').forEach(t => activeTags.add(t.toLowerCase()));
      }

      // Selected IDs
      const ids = params.get('ids');
      if (ids) {
        ids.split(',').forEach(id => selectedIds.add(id));
      }

      // Selection blurb
      const blurb = params.get('blurb');
      if (blurb) {
        selectionBlurb = blurb;
        document.getElementById('selection-blurb-input').value = blurb;
        document.getElementById('selection-blurb-text').textContent = `"${blurb}"`;
        document.getElementById('selection-blurb-section').classList.remove('hidden');
      }
    }

    function applyPresetFilter(slug) {
      const filter = filters.find(f => f.slug === slug);
      if (!filter) return;

      // Don't add preset tags to activeTags - the OR logic in getFiltered handles them
      // activeTags is only for manually clicked tags (AND logic)

      // Show blurb
      if (filter.blurb) {
        document.getElementById('blurb-text').textContent = `"${filter.blurb}"`;
        document.getElementById('blurb-section').classList.remove('hidden');
      }
    }

    function updateUrl() {
      const params = new URLSearchParams();

      const search = document.getElementById('search').value;
      if (search) params.set('q', search);

      const loc = document.getElementById('location-filter').value;
      if (loc) params.set('location', loc);

      const preset = document.getElementById('preset-filter').value;
      if (preset) params.set('filter', preset);

      if (activeTags.size > 0 && !preset) {
        params.set('tags', Array.from(activeTags).join(','));
      }

      if (selectedIds.size > 0) {
        params.set('ids', Array.from(selectedIds).join(','));
      }

      const newUrl = params.toString()
        ? `${window.location.pathname}?${params.toString()}`
        : window.location.pathname;

      window.history.replaceState({}, '', newUrl);
    }

    function getFiltered() {
      const search = document.getElementById('search').value.toLowerCase();
      const location = document.getElementById('location-filter').value;
      const presetSlug = document.getElementById('preset-filter').value;
      const preset = filters.find(f => f.slug === presetSlug);

      const idsParam = new URLSearchParams(window.location.search).get('ids');

      return people.filter(person => {
        // If explicit IDs in URL, only show those
        if (idsParam && !idsParam.split(',').includes(person.id)) {
          return false;
        }

        // If preset has specific IDs, only show those
        if (preset && preset.ids.length > 0) {
          if (!preset.ids.includes(person.id)) return false;
        }

        // Search
        if (search) {
          const searchable = [
            person.name,
            person.bio,
            person.location,
            ...person.tags
          ].join(' ').toLowerCase();

          if (!searchable.includes(search)) return false;
        }

        // Location (dropdown)
        if (location && person.location !== location) {
          return false;
        }

        // Location (preset - multiple allowed)
        if (preset && preset.locations.length > 0) {
          const personLocLower = person.location.toLowerCase();
          const matches = preset.locations.some(l => 
            personLocLower.includes(l.toLowerCase()) || 
            l.toLowerCase().includes(personLocLower)
          );
          if (!matches) return false;
        }

        // Tags: AND logic for manually selected tags, OR logic for preset tags
        if (activeTags.size > 0) {
          for (const tag of activeTags) {
            if (!person.tags.includes(tag)) return false;
          }
        }
        
        // Preset tags use OR logic (match ANY tag)
        if (preset?.tags?.length > 0) {
          const hasAnyTag = preset.tags.some(tag => person.tags.includes(tag));
          if (!hasAnyTag) return false;
        }

        return true;
      });
    }

    function render() {
      const filtered = getFiltered();
      const grid = document.getElementById('grid');
      const empty = document.getElementById('empty');
      const clearBtn = document.getElementById('clear-filters');

      document.getElementById('count').textContent = filtered.length;

      // Show/hide clear button
      const hasFilters = document.getElementById('search').value || 
                         document.getElementById('location-filter').value ||
                         document.getElementById('preset-filter').value ||
                         activeTags.size > 0;
      clearBtn.classList.toggle('hidden', !hasFilters);

      // Render active tags
      renderActiveTags();

      if (filtered.length === 0) {
        grid.classList.add('hidden');
        empty.classList.remove('hidden');
        return;
      }

      grid.classList.remove('hidden');
      empty.classList.add('hidden');

      grid.innerHTML = filtered.map(person => `
        <article class="card bg-white border border-warm-200 rounded-xl p-5 shadow-sm hover:shadow-md relative" onclick="toggleCardExpand(event, this)">
          <div class="absolute top-4 right-4 flex items-center gap-2">
            ${person.note ? `
              <span class="text-accent" title="Taq's note available">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M8.625 9.75a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm0 0H8.25m4.125 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm0 0H12m4.125 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm0 0h-.375m-13.5 3.01c0 1.6 1.123 2.994 2.707 3.227 1.087.16 2.185.283 3.293.369V21l4.184-4.183a1.14 1.14 0 0 1 .778-.332 48.294 48.294 0 0 0 5.83-.498c1.585-.233 2.708-1.626 2.708-3.228V6.741c0-1.602-1.123-2.995-2.707-3.228A48.394 48.394 0 0 0 12 3c-2.392 0-4.744.175-7.043.513C3.373 3.746 2.25 5.14 2.25 6.741v6.018Z" />
                </svg>
              </span>
            ` : ''}
            <input
              type="checkbox"
              class="checkbox-custom"
              ${selectedIds.has(person.id) ? 'checked' : ''}
              onchange="toggleSelect('${person.id}')"
              onclick="event.stopPropagation()"
            >
          </div>

          <h2 class="font-serif text-xl font-medium pr-8">
            <a href="${person.linkedin}" target="_blank" rel="noopener" class="hover:text-accent transition-colors inline-flex items-center gap-1.5 group" onclick="event.stopPropagation()">
              ${person.name}
              <svg class="w-4 h-4 text-[#0A66C2] opacity-60 group-hover:opacity-100 transition-opacity -translate-y-[1px]" viewBox="0 0 24 24" fill="currentColor"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
            </a>
          </h2>

          <p class="text-warm-800/60 text-sm mt-1 flex items-center gap-1">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            ${person.location}
          </p>

          <p class="bio-text mt-3 text-warm-800/80 text-sm leading-relaxed line-clamp-3">
            ${person.bio}
          </p>

          <!-- Truncated tags (shown by default) -->
          <div class="tags-truncated flex flex-wrap gap-1.5 mt-4">
            ${person.tags.slice(0, 5).map(tag => `
              <button class="tag px-2 py-0.5 bg-warm-100 text-warm-800/70 text-xs rounded cursor-pointer" onclick="event.stopPropagation(); addTag('${tag}')">
                ${tag}
              </button>
            `).join('')}
            ${person.tags.length > 5 ? `<span class="expand-hint px-2 py-0.5 text-warm-800/50 text-xs">+${person.tags.length - 5} more · tap to expand</span>` : ''}
          </div>

          <!-- Full tags (shown when expanded) -->
          <div class="tags-full flex-wrap gap-1.5 mt-4">
            ${person.tags.map(tag => `
              <button class="tag px-2 py-0.5 bg-warm-100 text-warm-800/70 text-xs rounded cursor-pointer" onclick="event.stopPropagation(); addTag('${tag}')">
                ${tag}
              </button>
            `).join('')}
          </div>

          ${person.note ? `
            <div class="note-section">
              <div class="bg-accent/10 border border-accent/20 rounded-lg p-3">
                <p class="text-xs font-medium text-accent mb-1">Taq's note</p>
                <p class="text-sm text-warm-800/90 italic">${person.note}</p>
              </div>
            </div>
          ` : ''}

          ${person.note ? `
            <div class="flex justify-center mt-3">
              <svg class="expand-indicator w-5 h-5 text-warm-800/30" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
              </svg>
            </div>
          ` : ''}
        </article>
      `).join('');

      updateSelectionBar();
    }

    function renderActiveTags() {
      const container = document.getElementById('active-tags');
      const presetSlug = document.getElementById('preset-filter').value;
      const preset = filters.find(f => f.slug === presetSlug);
      
      // Combine manual tags and preset tags for display
      const manualTagsHtml = Array.from(activeTags).map(tag => `
        <span class="inline-flex items-center gap-1 px-3 py-1 bg-accent text-white text-sm rounded-full">
          ${tag}
          <button onclick="removeTag('${tag}')" class="hover:bg-white/20 rounded-full p-0.5 transition-colors">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </span>
      `).join('');
      
      // Show preset tags as non-removable pills (different style)
      const presetTagsHtml = (preset?.tags || []).map(tag => `
        <span class="inline-flex items-center gap-1 px-3 py-1 bg-warm-800 text-white text-sm rounded-full opacity-70">
          ${tag}
        </span>
      `).join('');
      
      container.innerHTML = manualTagsHtml + presetTagsHtml;
    }

    function addTag(tag) {
      activeTags.add(tag);
      // Clear preset when manually adding tags
      document.getElementById('preset-filter').value = '';
      document.getElementById('blurb-section').classList.add('hidden');
      updateUrl();
      render();
    }

    function removeTag(tag) {
      activeTags.delete(tag);
      updateUrl();
      render();
    }

    function toggleSelect(id) {
      if (selectedIds.has(id)) {
        selectedIds.delete(id);
      } else {
        selectedIds.add(id);
      }
      updateUrl();
      render();
    }

    function toggleCardExpand(event, card) {
      // Don't toggle if clicking on interactive elements
      if (event.target.closest('a, button, input')) {
        return;
      }
      card.classList.toggle('expanded');
    }

    function updateSelectionBar() {
      const bar = document.getElementById('selection-bar');
      const count = document.getElementById('selected-count');
      const addMoreBtn = document.getElementById('add-more');

      if (selectedIds.size > 0) {
        bar.classList.remove('opacity-0', 'pointer-events-none');
        count.textContent = selectedIds.size;

        // Show "Add More" button if viewing a filtered selection (ids in URL)
        const idsParam = new URLSearchParams(window.location.search).get('ids');
        if (idsParam) {
          addMoreBtn.classList.remove('hidden');
        } else {
          addMoreBtn.classList.add('hidden');
        }
      } else {
        bar.classList.add('opacity-0', 'pointer-events-none');
      }
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 2500);
    }

    function clearAllFilters() {
      document.getElementById('search').value = '';
      document.getElementById('location-filter').value = '';
      document.getElementById('preset-filter').value = '';
      document.getElementById('blurb-section').classList.add('hidden');
      activeTags.clear();
      updateUrl();
      render();
    }

    // Event Listeners
    document.getElementById('search').addEventListener('input', () => {
      updateUrl();
      render();
    });

    document.getElementById('location-filter').addEventListener('change', () => {
      updateUrl();
      render();
    });

    document.getElementById('preset-filter').addEventListener('change', (e) => {
      // Clear manual tags when selecting preset
      activeTags.clear();
      
      if (e.target.value) {
        applyPresetFilter(e.target.value);
      } else {
        document.getElementById('blurb-section').classList.add('hidden');
      }
      
      updateUrl();
      render();
    });

    document.getElementById('share-btn').addEventListener('click', () => {
      navigator.clipboard.writeText(window.location.href);
      showToast('Link copied!');
    });

    document.getElementById('share-selected').addEventListener('click', () => {
      const newParams = new URLSearchParams();
      newParams.set('ids', Array.from(selectedIds).join(','));

      // Include blurb if provided
      const blurbInput = document.getElementById('selection-blurb-input').value.trim();
      if (blurbInput) {
        newParams.set('blurb', blurbInput);
      }

      navigator.clipboard.writeText(`${window.location.origin}${window.location.pathname}?${newParams.toString()}`);
      showToast('Selection link copied!');
    });

    function clearSelection() {
      selectedIds.clear();
      selectionBlurb = '';
      document.getElementById('selection-blurb-input').value = '';
      document.getElementById('selection-blurb-section').classList.add('hidden');
      updateUrl();
      render();
    }

    document.getElementById('clear-selected').addEventListener('click', clearSelection);
    document.getElementById('clear-selected-desktop').addEventListener('click', clearSelection);

    document.getElementById('clear-filters').addEventListener('click', clearAllFilters);

    document.getElementById('add-more').addEventListener('click', () => {
      // Remove ids from URL to show all people, but keep selections
      const params = new URLSearchParams(window.location.search);
      params.delete('ids');
      const newUrl = params.toString()
        ? `${window.location.pathname}?${params.toString()}`
        : window.location.pathname;
      window.history.replaceState({}, '', newUrl);
      render();
    });

    // Initialize
    init();
  </script>
</body>
</html>
